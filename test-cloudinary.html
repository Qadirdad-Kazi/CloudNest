<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Cloudinary Upload</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .upload-box {
            border: 2px dashed #ccc;
            padding: 40px;
            text-align: center;
            margin: 20px 0;
        }
        button {
            background: #0066ff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background: #0052cc;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        #uploadedImage {
            max-width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>🧪 Cloudinary Direct Upload Test</h1>
    
    <div class="upload-box">
        <p>Select an image to upload to Cloudinary:</p>
        <input type="file" id="fileInput" accept="image/*">
        <br><br>
        <button onclick="testUpload()">Upload to Cloudinary</button>
    </div>

    <div id="result"></div>
    <img id="uploadedImage" style="display:none;">

    <script>
        // Your Cloudinary credentials - CORRECT CLOUD NAME!
        const CLOUDINARY_CONFIG = {
            cloudName: 'dqm8stfmv',  // Your actual cloud name
            uploadPreset: 'cloudnest'
        };

        // Display config on page load
        document.addEventListener('DOMContentLoaded', () => {
            console.log('=== Cloudinary Configuration ===');
            console.log('Cloud Name:', CLOUDINARY_CONFIG.cloudName);
            console.log('Upload Preset:', CLOUDINARY_CONFIG.uploadPreset);
            console.log('Upload URL:', `https://api.cloudinary.com/v1_1/${CLOUDINARY_CONFIG.cloudName}/image/upload`);
        });

        async function testUpload() {
            const fileInput = document.getElementById('fileInput');
            const resultDiv = document.getElementById('result');
            const uploadedImage = document.getElementById('uploadedImage');
            
            if (!fileInput.files || !fileInput.files[0]) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = '❌ Please select a file first!';
                return;
            }

            const file = fileInput.files[0];
            resultDiv.innerHTML = '⏳ Uploading...';
            resultDiv.className = '';

            try {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', CLOUDINARY_CONFIG.uploadPreset);

                const uploadUrl = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CONFIG.cloudName}/image/upload`;
                
                console.log('Uploading to:', uploadUrl);
                console.log('Upload preset:', CLOUDINARY_CONFIG.uploadPreset);

                const response = await fetch(uploadUrl, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                console.log('Response status:', response.status);
                console.log('Response data:', data);
                
                if (response.ok) {
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `
                        ✅ <strong>Upload Successful!</strong><br>
                        <strong>URL:</strong> <a href="${data.secure_url}" target="_blank">${data.secure_url}</a><br>
                        <strong>Public ID:</strong> ${data.public_id}<br>
                        <strong>Format:</strong> ${data.format}<br>
                        <strong>Size:</strong> ${(data.bytes / 1024).toFixed(2)} KB
                    `;
                    
                    uploadedImage.src = data.secure_url;
                    uploadedImage.style.display = 'block';
                    
                    console.log('Upload success:', data);
                } else {
                    const errorMsg = data.error?.message || JSON.stringify(data);
                    throw new Error(errorMsg);
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = `
                    ❌ <strong>Upload Failed!</strong><br>
                    <strong>Error:</strong> ${error.message}<br>
                    <br>
                    <strong>Possible causes:</strong><br>
                    1. Upload preset "cloudnest" doesn't exist in Cloudinary<br>
                    2. Upload preset is not set to "Unsigned"<br>
                    3. Network/CORS issues<br>
                    <br>
                    Check the browser console for more details.
                `;
                console.error('Upload error:', error);
            }
        }
    </script>
</body>
</html>
