[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  VITE_API_URL = "https://cloud-nest-pi.vercel.app/api"

# Proxy API requests to Vercel backend (must be first!)
[[redirects]]
  from = "/api/*"
  to = "https://cloud-nest-pi.vercel.app/api/:splat"
  status = 200
  force = true
  headers = {X-From = "Netlify"}

# Handle SPA routing (must be last!)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
