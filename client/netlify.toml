[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# Proxy API requests to Vercel (same-origin for cookies)
[[redirects]]
  from = "/api/*"
  to = "https://cloud-nest-pi.vercel.app/api/:splat"
  status = 200
  force = true

# Handle SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
